[package]
name = "paneld"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.15.0"
dotenv = "0.15.0"
thiserror = "2.0.20"
serde_json = "1.0.151"

chrono = { version="0.4.45", features=["serde"] }
serde = { version="1.0.229", features=["derive"] }
tokio = { version="1.53.1", features=["full"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
actix-multipart = "0.8.1"
